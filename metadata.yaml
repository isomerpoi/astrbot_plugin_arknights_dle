name: astrbot_plugin_arknights_dle
display_name: 明日方舟干员竞猜(舟兜)
desc: |
  基于 AstrBot 框架开发的明日方舟干员竞猜小游戏 (Arknights Wordle/Loldle)。
  通过极致的“罗德岛战术终端”风格图片渲染，为你和群友提供沉浸式的硬核数据推理体验。
  支持自定义背景底图、隐藏指定列、自动抓取头像、智能防连抽发牌等高级特性。
version: 3.2.6
author: isomerpoi
